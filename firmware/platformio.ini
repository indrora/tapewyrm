; Tapewyrm firmware -- PlatformIO build (replaces Makefile/Rules.mk).
;
; We use the official `ststm32` platform purely as a toolchain + SCons host:
; there is NO framework. The code is GW-derived bare-metal register code, so
; scripts/pio_post.py throws away the platform's default bare-metal flags
; (-lc/-lstdc++, -fdata-sections, F_CPU, default include paths) and installs
; the exact flag set the old Rules.mk used; scripts/pio_pre.py adds the
; per-file flags. See those scripts for the long-form discussion of why.
;
; Only the AT32F4 (Greaseweazle V4.x) target is built. The STM32F1/F7 MCU
; sources are still in-tree but are not wired up here.
;
; Envs:
;   bootloader  -> 16K @ 0x08000000 (GW-compatible application bootloader)
;   tapewyrm    -> 48K @ 0x08004000 (main firmware; flashed via the bootloader)

[platformio]
src_dir = src
include_dir = inc
boards_dir = boards
default_envs = tapewyrm, bootloader

[env]
platform = ststm32
board = greaseweazle_v4_at32f403a
; Pin the compiler. Left alone, ststm32 resolves its default toolchain, which
; is gcc 7.2.1 (2017) -- older than anything upstream Greaseweazle builds with.
; gcc 12.3 is the current xPack build in the PlatformIO registry.
platform_packages = platformio/toolchain-gccarmnoneeabi@~1.120301.0
extra_scripts =
    pre:scripts/pio_pre.py
    post:scripts/pio_post.py
; Firmware version, consumed by build_info.c (and mk_update.py naming).
custom_fw_major = 1
custom_fw_minor = 6
; Objects common to both images (mirrors src/Makefile, src/mcu/at32f4/Makefile,
; src/usb/Makefile for mcu=at32f4). qic/qic.c and mcu/at32f4/{board,floppy}.c
; are NOT listed: they are #included by src/floppy.c and src/board.c.
build_src_filter =
    -<*>
    +<board.c> +<build_info.c> +<crc.c> +<vectors.S> +<string.c>
    +<cortex.c> +<time.c> +<timer.c> +<util.c>
    +<mcu/at32f4/stm32.c> +<mcu/at32f4/fpec.c> +<mcu/at32f4/testmode.c>
    +<usb/config.c> +<usb/core.c> +<usb/cdc_acm.c>
    +<usb/hw_dwc_otg.c> +<usb/hw_usbd_at32f4.c> +<usb/hw_at32f4.c>

[env:tapewyrm]
build_src_filter =
    ${env.build_src_filter}
    +<main.c> +<floppy.c> +<testmode.c>

[env:bootloader]
custom_bootloader = yes
build_src_filter =
    ${env.build_src_filter}
    +<fw_update.c>
