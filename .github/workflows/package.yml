name: package

# Build the WHOLE project as one package (host wheel + firmware images) -> dist/.
# The firmware half goes through PlatformIO (tools/package.py), which fetches its
# own pinned ARM GCC; installing `pio` itself is out of this workflow's scope.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build the full release (all MCUs + .upd + host wheel)
        run: uv run tools/package.py --dist
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: tapewyrm-package
          path: dist/tapewyrm-*.zip
