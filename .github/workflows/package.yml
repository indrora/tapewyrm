name: package

# Build the WHOLE project as one package (host wheel + firmware images) -> dist/.
# The firmware half goes through PlatformIO (tools/package.py), installed with
# pipx; PlatformIO fetches its own pinned ARM GCC (cached below).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        # The runner's system Python is "externally managed" (PEP 668), so pip
        # cannot install into it; setup-python gives a normal interpreter.
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pipx and PlatformIO
        run: |
          python -m pip install --upgrade pipx
          python -m pipx install platformio
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache PlatformIO toolchains and packages
        # PlatformIO downloads its pinned ARM GCC and framework on first use.
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Build the full release (all MCUs + .upd + host wheel)
        run: uv run tools/package.py --dist
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: tapewyrm-package
          path: dist/tapewyrm-*.zip
