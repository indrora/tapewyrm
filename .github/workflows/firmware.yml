name: firmware

# Builds the vendored Greaseweazle firmware (with the Tapewyrm QIC layer grafted
# in) for the AT32F403A (v4.1) target, entirely in-tree, via `just fw`'s path:
# tools/package.py -> PlatformIO (firmware/platformio.ini). PlatformIO pins and
# fetches its own ARM GCC, so no system toolchain is installed here. Making sure
# `pio` itself is on the runner is deliberately OUT of this workflow's scope: the
# build step expects the runner image to already provide it.

on:
  push:
    paths: ["firmware/**", "tools/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "tools/**", ".github/workflows/firmware.yml"]

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build firmware image (at32f4) in-tree
        # Same command as `just fw`: PlatformIO builds the bootloader + app envs,
        # then a pure-Python Intel-HEX merge (tools/ihex.py) -- no make/srecord.
        run: uv run tools/package.py --skip-host --mcus at32f4
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tapewyrm-firmware-at32f4
          path: dist/**/firmware/*
