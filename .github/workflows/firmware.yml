name: firmware

# Builds the vendored Greaseweazle firmware (with the Tapewyrm QIC layer grafted
# in) for the AT32F403A (v4.1) target, entirely in-tree, via `just fw`'s path:
# tools/package.py -> PlatformIO (firmware/platformio.ini). PlatformIO is
# installed with pipx; it pins and fetches its own ARM GCC (cached below), so no
# system toolchain is installed here.

on:
  push:
    paths: ["firmware/**", "tools/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "tools/**", ".github/workflows/firmware.yml"]

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        # The runner's system Python is "externally managed" (PEP 668), so pip
        # cannot install into it; setup-python gives a normal interpreter.
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pipx and PlatformIO
        run: |
          python -m pip install --upgrade pipx
          python -m pipx install platformio
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache PlatformIO toolchains and packages
        # PlatformIO downloads its pinned ARM GCC and framework on first use.
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Build firmware image (at32f4) in-tree
        # Same command as `just fw`: PlatformIO builds the bootloader + app envs,
        # then a pure-Python Intel-HEX merge (tools/ihex.py) -- no make/srecord.
        run: uv run tools/package.py --skip-host --mcus at32f4
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tapewyrm-firmware-at32f4
          path: dist/**/firmware/*
