name: packages

# Every Python package under packages/ (STYLE.md §2). They depend on each other
# through editable path sources (tapewyrm-cli -> tapewyrm-archive, ...), so a
# change to any package re-checks all of them.
on:
  push:
    paths: ["packages/**", ".github/workflows/packages.yml"]
  pull_request:
    paths: ["packages/**", ".github/workflows/packages.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: tapewyrm-archive, module: tapewyrm_archive }
          - { package: qiclib, module: qiclib }
          - { package: tapewyrm-cli, module: tapewyrm }
          - { package: qicsilver, module: qicsilver }
          - { package: cinnabar, module: cinnabar }
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      # uv's cache, saved to the GitHub Actions cache. setup-uv caches by
      # default, but its defaults don't fit this matrix:
      # - The default key hashes every **/uv.lock, so all five legs share one
      #   key: the first leg to finish saves its (small) cache and the rest
      #   "hit" it, never saving their own -- cinnabar re-downloaded ~300 MB
      #   of PySide6 every run. cache-suffix + a per-package lockfile give
      #   each leg its own key, invalidated when that package's lock changes.
      # - prune-cache (default true) runs `uv cache prune --ci`, which drops
      #   every wheel downloaded from PyPI before saving; keep them instead.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.package }}
          cache-dependency-glob: packages/${{ matrix.package }}/uv.lock
          prune-cache: false
      - name: Sync
        run: uv sync --extra dev
      # PySide6's QtGui links libEGL / libGL / libxkbcommon at import time,
      # even under the offscreen platform plugin (which only avoids needing
      # an X server). ubuntu-latest doesn't ship them, so cinnabar's tests die
      # at collection with "libEGL.so.1: cannot open shared object file".
      - name: Qt system libraries
        if: matrix.package == 'cinnabar'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0
      - name: Qt offscreen
        run: echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy ${{ matrix.module }}
      - name: Pytest
        run: uv run pytest --cov=${{ matrix.module }} --cov-report=term-missing
