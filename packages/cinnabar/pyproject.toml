[project]
name = "cinnabar"
version = "0.1.0"
description = "Look at a QIC tape: flux, records, fields and bytes, track by track, segment by segment"
readme = "README.md"
requires-python = ">=3.11"
license = "Unlicense"
authors = [{ name = "Tapewyrm contributors" }]

# A desktop viewer. It owns presentation (Qt through pyqtgraph, rich for the
# terminal) and reads through the libraries below it (STYLE.md §2). It depends
# on tapewyrm-cli for one thing only: the flux codec (``tapewyrm.codec``), the
# PLL and MFM framer that turn a TWRF capture into sectors. Nothing in the
# package graph points back at cinnabar, so ``tw`` never imports Qt.
dependencies = [
    "qiclib",
    "tapewyrm-archive",
    "tapewyrm",
    "numpy>=1.26",
    "pyqtgraph>=0.13.7",
    "PySide6>=6.6",
    "rich>=15.0.0",
    "rich-click>=1.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
cinnabar = "cinnabar.cli:cli"

[tool.uv.sources]
qiclib = { path = "../qiclib", editable = true }
tapewyrm-archive = { path = "../tapewyrm-archive", editable = true }
tapewyrm = { path = "../tapewyrm-cli", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cinnabar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cinnabar"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["cinnabar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
