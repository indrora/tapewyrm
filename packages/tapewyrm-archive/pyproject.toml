[project]
name = "tapewyrm-archive"
version = "0.1.0"
description = "Tapewyrm's on-disk formats: TWRF flux captures, TWTI tape images, TWVL volumes"
readme = "README.md"
requires-python = ">=3.11"
license = "Unlicense"
authors = [{ name = "Tapewyrm contributors" }]

# This is the base every other package depends on (tapewyrm CLI, qiclib,
# qicsilver), so it is stdlib-only: no rich, click or other presentation
# libraries (STYLE.md §2), and nothing from the hardware stack. The one
# exception is backports.zstd, the official backport of the stdlib
# `compression.zstd` module (PEP 784, Python 3.14+) for TWTZ images; on 3.14+
# it is not installed and the stdlib module is used (tapewyrm_archive/_zstd.py).
dependencies = [
    "backports.zstd; python_version < '3.14'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tapewyrm_archive"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["tapewyrm_archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
