[project]
name = "qiclib"
version = "0.1.0"
description = "QIC tape layout and backup formats: QIC-80 segments/ECC/header, QIC-113, QIC-122, volume profiles"
readme = "README.md"
requires-python = ">=3.11"
license = "Unlicense"
authors = [{ name = "Tapewyrm contributors" }]

# A library: stdlib-only apart from the archive formats (STYLE.md §2). No rich,
# click or other presentation libraries, and nothing from the hardware stack.
dependencies = ["tapewyrm-archive"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv.sources]
tapewyrm-archive = { path = "../tapewyrm-archive", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# qiclib/profiles/volume/*.toml ship inside the package (hatch includes package data).
[tool.hatch.build.targets.wheel]
packages = ["qiclib"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["qiclib"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["qiclib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
