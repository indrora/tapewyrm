# QICStream v2: the "FSET" control-code stream (qiclib.fileset.qicstream_fset).
#
# Written from Dmitry Brant's QICStreamReader (qicstreamv2/Program.cs and the
# Vtbl2Record in headerview/Program.cs; read, never a dependency). No tape on
# the bench carries it, so the profile is untested and says so: every volume
# it reads warns `untested` until one does.
#
# The fingerprint is in the VOLUME bytes, not the table: "FSET" at offset 4 of
# the volume (Program.cs line 170; the headerview record puts "VTBL" at the
# same offset). The table stage has nothing of this profile's to gate on, so it
# survives `[match]` on every tape and is only told apart once qiclib.extract
# has built the volume and `_probe_with` applies `volume_bytes`: without the
# magic its probe is fatal and the profile is out. At the table stage it is
# DEFERRED (qiclib.volume_profile.rank seats it behind every survivor the table
# can vouch for): its Rev N reading of a vendor-specific record would otherwise
# outscore vendor-unknown, which reads nothing past byte 56, and name this
# software on every tape whose vendor bit is set (seen on the bench 2026-11-07).
# It is reached only when the table-stage winner's parser fails its probe and
# qiclib.extract falls back to the survivors that built the same bytes.
#
# The [vtbl] offsets below are Rev N's as a starting assumption and are
# UNVERIFIED. QICStreamReader's Vtbl2Record suggests the real record is a
# different shape altogether: "VTBL" at byte 4 (not 0), a time_t at 0x1C, and a
# u16-prefixed label at 0x3C followed by a u16-prefixed drive name, the same
# shape as the volume header. If so, qiclib.volume.parse_volume_table_data
# (which wants the signature at byte 0) will not even find the record, and a
# real tape will need its own table reader before this profile is reached. Fix
# the offsets from the first real record.

name = "qicstream-v2"
description = "QICStream v2: 'FSET' at volume byte 4; a control-code stream of headers and chunks"
status = "untested"

[match]
volume_bytes = [[4, "46534554"]]   # "FSET"

# Rev N offsets, assumed; see above.
[vtbl]
multi_cartridge_seq = [57, 1]
dir_section_size = [92, 4]
data_section_size = [96, 8]
source_label = [106, 16]
compression = [124, 1]
os_type = [125, 1]

[fileset]
parser = "qicstream-fset"
