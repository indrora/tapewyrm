# A vendor-specific entry we have no layout for.
#
# QIC-80-MC Rev N §8: when byte 56 bit 0 is set, "only this bit and the
# previous bytes (0-55) are defined". So this profile reads nothing past byte
# 56 -- the honest answer for an unknown vendor. Its only fingerprint is that
# flag, so it wins by default (and carries `generic`) whenever a vendor-specific
# entry matches nothing more specific; a tape it ends up reading is the first
# thing to write a real profile for.
#
# No sizes are known, so the extractor sizes the volume from its segments. The
# Basic-DOS parser is the best guess for a DOS-era tape (it walks the data
# section by signature when the table gives it nothing), and its probe says
# whether that guess read anything.

name = "vendor-unknown"
description = "Vendor-specific entry with an unknown layout: bytes 0-56 only"
status = "spec"

[match]
vendor_bit = true

[fileset]
parser = "qic113-basic"
