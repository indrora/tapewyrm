[project]
name = "tapewyrm"
version = "0.1.0"
description = "tw: capture QIC-80 floppy tapes as flux over Greaseweazle v4.1 and convert them to TWTI tape images"
readme = "README.md"
requires-python = ">=3.11"
license = "Unlicense"
authors = [{ name = "Tapewyrm contributors" }]

# Core runtime deps. The codec is pure stdlib Python -- Greaseweazle's PLL is
# vendored (tapewyrm/codec/gwpll.py), not depended on -- so the whole decode stack
# stays importable and fixture-testable with no hardware and no heavy wheels
# (DESIGN.md §6A.10, §13.6).
dependencies = [
    "click>=8.1",
    "pyserial>=3.5",
    "rich>=15.0.0",
    "rich-click>=1.9.9",
    "tapewyrm-archive",
    # `tw convert` (sectors -> TWTI) is the only command that needs it; the rest
    # of the package uses only its data types. STYLE.md §2.
    "qiclib",
]

# Sibling packages in this repository (packages/*), installed editable.
[tool.uv.sources]
tapewyrm-archive = { path = "../tapewyrm-archive", editable = true }
qiclib = { path = "../qiclib", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
# `tw` is the shipped command: capture, convert to a TWTI image, drive and flash
# the board (reading the image is qicsilver's job). It deliberately does NOT
# reuse or require the `gw` executable (DESIGN.md §1).
# `tapewyrm` is kept as a long-form alias.
tw = "tapewyrm.cli:cli"
tapewyrm = "tapewyrm.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tapewyrm"]

# hatch_build.py stamps the git commit into the wheel for `tw info`.
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated by protocol/generate.py — its formatting is owned by the generator,
# not ruff; excluding it keeps the contract drift-check (CI) stable.
extend-exclude = ["tapewyrm/link/protocol.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]  # long lines tolerated in tables/spec comments

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["tapewyrm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
