# TEAC FT-3010 (label on the unit says TEAC). Reports vendor 0x01cc, which
# ftape-vendors.h (Linux 2.6.19) lists as "Wangtek 3200 / Teac 700" with
# wake_up_colorado -- TEAC shipped that ID on its own units; the "Teac FT3010TR"
# entry there is 0x03cf, make 15. Bench 2026-11-05: ROM 0x8c, references a
# Colorado preformatted QIC-3010-MC 400 ft tape (Report Tape Status 0x64).
#
# ftape's colorado wake (Phantom Select + Enter Primary Mode is what it
# answers) on top of generic, with a TIGHTER pulse train: this drive's command
# time-out sits at ~2.2 ms (ACK 2.2 ms after the last STEP pulse under
# `tw drive scope`), so the older 2.2 ms period split trains on the bench. An
# isolated pulse is Soft Reset and a stray five is Alternate Command Time-out;
# the drive did both (error 27 latched with no Soft Reset ever sent; ACKs at
# ~6.25 ms, past the then 5.5 ms ACK window, so every report was abandoned
# mid-subcontext and the drive ended up dark on every output). 200 + 1300 =
# 1.5 ms is the centre of TSTEP's 0.9-2.1 ms window: 3/3 `tw drive status`,
# 600/600 reports in 60 s, two load-points, all clean.
#
# Quirk (Rev J cmd 14): the drive holds its automatic Seek Load Point until the
# first Report Drive Status, then runs it and reports NOT Ready (on the bench,
# sometimes no ACK at all) until done, ~45 s; Report Error Code (7) is rejected
# (Table 2a: needs Ready) until then, and a Seek Load Point sent while the
# new-cartridge latch is still set is rejected too. wake() waits that out.
# Never leave a report half-clocked on this drive (an ACK timeout, `tw drive
# scope --pulses N`, a Soft Reset): it goes dark on every output and only a
# power cycle brings it back. Its cue INDEX free-runs every 2.5 ms in every
# state, so index_edge and the firmware WAIT_READY mean nothing here.

name = "teac"
inherits = "generic"
wakeup = "colorado"
vendor_ids = [0x01cc]

[timing]
inter_pulse_us = 1300       # trailing-edge gap -> 1.5 ms leading-edge period
terminate_gap_us = 3300     # 3.5 ms from the last leading edge
