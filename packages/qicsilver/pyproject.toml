[project]
name = "qicsilver"
version = "0.1.0"
description = "Read QIC tape images (TWTI) and recover the files on them: identify, extract, tar"
readme = "README.md"
requires-python = ">=3.11"
license = "Unlicense"
authors = [{ name = "Tapewyrm contributors" }]

# A CLI: it owns presentation (rich, rich-click), the libraries below it don't
# (STYLE.md §2). No dependency on the hardware package, tapewyrm-cli.
dependencies = [
    "qiclib",
    "tapewyrm-archive",
    "rich>=15.0.0",
    "rich-click>=1.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
qicsilver = "qicsilver.cli:cli"

[tool.uv.sources]
qiclib = { path = "../qiclib", editable = true }
tapewyrm-archive = { path = "../tapewyrm-archive", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qicsilver"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["qicsilver"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["qicsilver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
