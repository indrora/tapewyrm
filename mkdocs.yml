# MkDocs site for Tapewyrm. Pages live in docs/; agents/ is deliberately not
# published. Build with `just docs-build` (strict: broken links fail the build),
# preview with `just docs`. Every page must appear in `nav` below -- see
# STYLE.md section 4.
site_name: Tapewyrm
site_description: Recover QIC-40, QIC-80, QIC-3010 and QIC-3020 floppy tapes with a Greaseweazle v4.1.
site_url: https://indrora.github.io/tapewyrm/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: shadcn
  show_title: true
  show_stargazers: false
  topbar_sections: true
  pygments_style:
    light: github-light
    dark: github-dark

# docs/qic-standards/ (the standards PDFs) is published so the format pages can
# link to them; only the macOS cruft is excluded.
exclude_docs: |
  .DS_Store

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - codehilite
  - fenced_code
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Home:
      - Tapewyrm: index.md
      - Getting started:
          - Start here: guide/index.md
          - Install the tools: guide/install.md
          - Flash the Greaseweazle: guide/flash-greaseweazle.md
          - Wire up a drive: guide/wiring.md
          - Read a tape: guide/read-a-tape.md
          - Troubleshooting: guide/troubleshooting.md
          - Keep captures private: guide/privacy.md
  - Software:
      - tw:
          - tw overview: tw/index.md
          - tw info: tw/info.md
          - tw drive: tw/drive.md
          - tw dump: tw/dump.md
          - tw convert: tw/convert.md
          - tw inspect: tw/inspect.md
          - tw flash and tw dfu: tw/flash.md
          - Drive profiles: tw/profiles.md
          - Configuration and logging: tw/config.md
      - qicsilver:
          - qicsilver overview: qicsilver/index.md
          - qicsilver identify: qicsilver/identify.md
          - qicsilver extract: qicsilver/extract.md
          - qicsilver inspect: qicsilver/inspect.md
          - qicsilver tar: qicsilver/tar.md
          - Cartridge and volume profiles: qicsilver/profiles.md
          - Manual read overrides: qicsilver/overrides.md
      - cinnabar:
          - cinnabar overview: cinnabar/index.md
          - Lanes: cinnabar/lanes.md
          - Passes and merged reads: cinnabar/passes.md
          - Themes and settings: cinnabar/settings.md
  - Hardware:
      - hardware/index.md
      - Greaseweazle v4.1: hardware/greaseweazle.md
      - Drives:
          - Supported drives: hardware/drives/index.md
          - Colorado Jumbo 350: hardware/drives/colorado-350.md
          - Colorado 1400: hardware/drives/colorado-1400.md
          - TEAC FT-3010: hardware/drives/teac-ft3010.md
          - Conner and Iomega: hardware/drives/untested.md
      - Cartridges: hardware/cartridges.md
  - Development:
      - Formats:
          - Formats overview: formats/index.md
          - QIC-117 command interface: formats/qic-117.md
          - QIC-80-MC recording format: formats/qic-80-mc.md
          - QIC-3010 and QIC-3020: formats/qic-3010-3020.md
          - Error correction: formats/ecc.md
          - Header and bad-sector map: formats/header.md
          - Volume table: formats/volume-table.md
          - QIC-113 file sets: formats/qic-113.md
          - QIC-122 compression: formats/qic-122.md
          - Vendor formats:
              - About vendor formats: formats/vendor/index.md
              - Colorado (CMS) backup: formats/vendor/cms.md
              - MTN backup: formats/vendor/mtn.md
          - QIC standards library: formats/standards.md
      - Codebase:
          - Codebase overview: dev/index.md
          - Building and testing: dev/building.md
          - tapewyrm-cli: dev/tapewyrm-cli.md
          - tapewyrm-archive: dev/tapewyrm-archive.md
          - qiclib: dev/qiclib.md
          - qicsilver: dev/qicsilver.md
          - cinnabar: dev/cinnabar.md
          - Firmware: dev/firmware.md
          - Device protocol: dev/protocol.md
          - Writing a volume profile: dev/volume-profiles.md
      - Specifications:
          - Specifications overview: spec/README.md
          - TWS-1 TWRF: spec/twrf.md
          - TWS-2 TWTI/TWTZ: spec/twti.md
          - TWS-3 TWVL: spec/twvl.md
