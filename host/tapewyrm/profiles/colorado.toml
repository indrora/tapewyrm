# Colorado / HP Colorado QIC-80 floppy-tape drive family.
#
# QIC-117 Rev J defaults (DESIGN.md §13.1). Timings sit inside Rev J Table 1
# (STEPW 1-1100 us, STEP 0.9-2.1 ms, TIMEOUT 2.2-2.9 ms) and were exercised on
# the bench; select/wake are bench-confirmed (see [[wake]] below).
# TODO(bench), DESIGN.md §9 item 3 / §13.6 item 3: characterize the real wake
# sequence, exact pulse/report timings, CCS level (does it support 36/37 geometry,
# Skip-Extended, Report Tape Status?), and vendor quirks on the bench via
# `gw pin` + scope before trusting this profile.

name = "colorado"
bit_order = "lsb"           # QIC-117 reports clock LSB-first off TRK0 (§2.1)
report_strategy = "index_edge"  # prefer waiting on INDEX edge over a blind settle (§5.3)
quirks = []                 # TODO(bench): e.g. "slow_wake", "no_ccs2_geometry"

[timing]
pulse_us = 200              # STEP pulse width
inter_pulse_us = 2000       # ~2.0 ms STEP interval (Rev J 0.9-2.1 ms)
terminate_gap_us = 3000     # > 2.9 ms ends a command train (< => Soft Reset)
report_settle_us = 900      # report bit appears within 900 us of 2nd pulse
motion_timeout_s = 20       # generic motion wait-ready ceiling (seek 15 s, stop 8 s)

# Wake sequence: list of (cmd, arg, delay_ms).
# Bench-confirmed 2026-09-30 on a jumperless Colorado Jumbo 350:
#   * The drive is a PHANTOM drive: it ignores DS0-3 and is selected by
#     Phantom Select (46) followed by its N+2 unit-address argument, unit 0.
#     A bare 46 (no argument) does nothing -- that cost an evening.
#   * Once selected and ready it emits cue INDEX pulses ~2.9 ms apart
#     (QIC-117 Rev J Fig. 1/6), which is the quickest "am I selected?" check.
#   * Do NOT end the sequence with Soft Reset: a Reset deselects a phantom
#     drive (Rev J p.18). Qic117Drive.wake() reads status after these steps,
#     which reads+clears the latched error (26 = Power On Reset Occurred).
[[wake]]
cmd = "phantom select"
arg = 0
delay_ms = 50

[[wake]]
cmd = "enter primary mode"
delay_ms = 50
